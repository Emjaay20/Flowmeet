name: FlowMeet Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # RUST PLATFORM PIPELINE (Team Core Showcase)
  # High-throughput Crawler, Permissions Engine & Agent DX Tools
  # ============================================================================
  rust-platform:
    name: Rust Platform, Permissions & Agent Tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crawler
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crawler -> target"

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter (Zero-Warning Enforcement)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace --verbose

      - name: Run Platform Security Policy Linter
        run: cargo run -p flowmeet-agent-tools -- lint-policies

      - name: Verify Microbenchmark Suite Compiles and Runs
        run: cargo bench -p flowmeet-permissions --bench policy_bench -- --test

  # ============================================================================
  # KUBERNETES & GITOPS MANIFEST VALIDATION
  # Validates Helm chart & Flux GitOps YAML manifests
  # ============================================================================
  k8s-gitops-validation:
    name: Kubernetes & Flux GitOps Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Kubernetes & Flux YAML manifests
        run: |
          python3 -c "
          import glob, yaml, sys
          files = glob.glob('deploy/**/*.yaml', recursive=True) + glob.glob('deploy/**/*.yml', recursive=True)
          errors = 0
          for f in files:
              if 'templates/' not in f:
                  try:
                      with open(f) as fp:
                          yaml.safe_load(fp)
                          print(f'  [VALID] {f}')
                  except Exception as e:
                      print(f'  [ERROR] {f}: {e}')
                      errors += 1
          if errors > 0:
              sys.exit(1)
          print('All non-template YAML manifests are valid.')
          "

  # ============================================================================
  # DOCKER & CARGO-CHEF BUILD VERIFICATION
  # Verifies Docker layer caching and multi-stage container optimization
  # ============================================================================
  docker-build-verification:
    name: Docker & Cargo-Chef Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Crawler Container with Layer Caching
        uses: docker/build-push-action@v5
        with:
          context: ./crawler
          file: ./crawler/Dockerfile
          push: false
          tags: flowmeet-crawler:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # GO CONCIERGE SERVICE
  # Sub-50µs Territory Rules Routing Engine
  # ============================================================================
  go-concierge:
    name: Go Territory Concierge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./concierge
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: concierge/go.sum

      - name: Run Go Unit Tests
        run: go test -v -race ./...

  # ============================================================================
  # FRONTEND & INTEGRATION GATEWAY
  # Next.js 16 Web Application
  # ============================================================================
  nextjs-web:
    name: Next.js Web Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit
