name: flowmeet-platform
services:
  flowmeet-web:
    build: .
    image: flowmeet-platform-web:local
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      RUST_CRAWLER_URL: http://flowmeet-crawler:8081
      GOLANG_CONCIERGE_URL: http://flowmeet-concierge:8082
      PYTHON_AI_BRAIN_URL: http://flowmeet-ai-brain:8083
      N8N_INTERNAL_WEBHOOK_URL: http://flowmeet-n8n:5678/webhook/flowmeet-polyglot-triage
    depends_on:
      flowmeet-crawler:
        condition: service_healthy
      flowmeet-concierge:
        condition: service_healthy
      flowmeet-ai-brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: aetherhost-net
      traefik.http.routers.flowmeet-platform-ng.rule: Host(`flowmeet.aetherhost.com.ng`)
      traefik.http.routers.flowmeet-platform-ng.priority: "100"
      traefik.http.routers.flowmeet-platform-ng.entrypoints: websecure
      traefik.http.routers.flowmeet-platform-ng.tls.certresolver: letsencrypt
      traefik.http.routers.flowmeet-platform-ng.service: flowmeet-platform-ng
      traefik.http.services.flowmeet-platform-ng.loadbalancer.server.port: "3000"
    networks: [internal, aetherhost-net]
  flowmeet-crawler:
    build: ./crawler
    restart: unless-stopped
    mem_limit: 128m
    environment:
      FLOWMEET_SERVICE_TOKEN: ${FLOWMEET_SERVICE_TOKEN:?Set a service token of at least 32 characters}
      RUST_LOG: flowmeet_crawler=info
      TOKIO_WORKER_THREADS: "2"
    networks: [internal]
  flowmeet-concierge:
    build: ./concierge
    restart: unless-stopped
    mem_limit: 64m
    environment:
      GOMAXPROCS: "2"
    networks: [internal]
  flowmeet-ai-brain:
    build: ./ai-brain
    restart: unless-stopped
    mem_limit: 128m
    networks: [internal]
  flowmeet-n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.46.6}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set an encryption key}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PAYLOAD_SIZE_MAX: "1"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Africa/Lagos
      NODE_OPTIONS: --max-old-space-size=512
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    ports: ["127.0.0.1:5680:5678"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks: [internal]
volumes:
  n8n-data:
networks:
  internal:
  aetherhost-net:
    external: true
