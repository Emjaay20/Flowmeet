[package]
name = "flowmeet-agent-tools"
version = "0.1.0"
edition = "2021"
description = "Platform CLI and MCP tool harness empowering AI coding agents in FlowMeet Rust services"
authors = ["Yusuf Abubakar Saka <yusuf@yusufsaka.dev>", "FlowMeet Platform Team"]
license = "MIT"

[dependencies]
flowmeet-permissions = { path = "../flowmeet-permissions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
